name: Build

on:
  # Toutes les branches, pas les tags : le déploiement compile lui-même.
  # Une PR interne affiche le résultat de ce push ; pas de déclencheur pull_request en double.
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and gametests
        run: ./gradlew build runGameTestServer

      - uses: actions/upload-artifact@v4
        with:
          name: moddevarpg-jar
          path: build/libs/*.jar
          retention-days: 14
