name: Deploy dev server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  MOD_FILE: ModDevARPG.jar   # nom fixe sur le serveur (évite les doublons de version)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Find jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -n1)
          echo "Jar: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.SFTP_USER }}" --env-password \
            "sftp://${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }}" -e "
            set sftp:auto-confirm yes;
            cd mods;
            put '${{ steps.jar.outputs.path }}' -o $MOD_FILE;
            bye"

      - name: Restart server
        run: |
          curl -fsS -X PUT "https://mine.sttr.io/server/${{ secrets.MINESTRATOR_SERVER_ID }}/poweraction" \
            -H "Authorization: Bearer ${{ secrets.MINESTRATOR_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"poweraction":"restart"}'
