plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Ressources produites par runData.
    srcDir('src/generated/resources')

    // Fichiers de travail exclus du jar.
    exclude("**/*.bbmodel") // Projets BlockBench
    exclude("src/generated/**/.cache") // Cache de runData
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.11 fournit Java 21 aux joueurs.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = project.neo_version
        // true évite de décompiler Minecraft (machines à peu de RAM, ex. Codespace 8 Go),
        // au prix des sources dans l'IDE. Ne pas committer ce changement.
        disableRecompilation = false
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Lance tous les gametests enregistrés puis s'arrête ; code de sortie non nul en cas d'échec.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Ajouter des marqueurs (SCAN, REGISTRIES, REGISTRYDUMP) ou passer en DEBUG pour diagnostiquer.
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime : dépendances présentes uniquement pour les lancements de développement.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Toute dépendance vers un autre mod demande l'accord du responsable (voir init.md).
}

// Remplace les ${...} des templates par les valeurs de gradle.properties.
// Une propriété absente fait échouer le build.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Copie le jar dans le dossier mods de l'instance CurseForge « ModDevARPG » (chemin par défaut),
// ou dans le dossier donné par -PclientModsDir=... ou par clientModsDir dans ~/.gradle/gradle.properties.
// Nom de fichier fixe : chaque version remplace la précédente, comme sur le serveur.
// Tâche simple plutôt que Copy : Copy créerait le dossier cible avant toute vérification.
tasks.register('installClient') {
    group = 'distribution'
    description = 'Installe le mod dans l\'instance CurseForge locale.'
    def customDir = providers.gradleProperty('clientModsDir')
    def modsDir = file(customDir.getOrElse(
            "${System.getProperty('user.home')}/curseforge/minecraft/Instances/${mod_name}/mods"))
    // Une instance CurseForge contient minecraftinstance.json ; un dossier personnalisé doit déjà exister.
    def required = customDir.isPresent() ? modsDir : new File(modsDir.parentFile, 'minecraftinstance.json')
    def target = new File(modsDir, "${mod_name}.jar")
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(jarFile)
    doLast {
        if (!required.exists()) {
            throw new GradleException("Introuvable : ${required}. Créer le profil CurseForge « ModDevARPG » " +
                    "(voir README) ou passer -PclientModsDir=<dossier mods existant>.")
        }
        modsDir.mkdirs()
        java.nio.file.Files.copy(jarFile.get().asFile.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Mod installé : ${target}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
